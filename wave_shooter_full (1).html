<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Wave Shooter — Fixed Version</title>
  <style>
    body { margin: 0; background: #0b1b2a; color: #fff; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; cursor: crosshair; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width = innerWidth;
let H = canvas.height = innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
});

let player;
let bullets;
let enemyProjectiles;
let enemies;
let keys;
let damageNumbers;
let shopButtons;
let uiButtons;
let powerUps;
let lastTime;
let round;
let coins;
let gameOver;
let inShop;
let endlessMode;
let awaitingEndlessChoice;
let survivalTime;
let endlessDifficultyTimer;
let nextRandomBossAt;
let aimX;
let aimY;
let killStreak;
let streakTimer;
let streakMultiplier;
let frenzyTimer;
let selectingCharacter;
let selectedCharacter;
let characterButtons;

const monsterTypes = [
  { name: 'slime', color: '#61d66f', r: 18, speedMult: 0.9, hpMult: 0.9, damageMult: 0.9, canShoot: false },
  { name: 'goblin', color: '#7db340', r: 20, speedMult: 1.1, hpMult: 1.0, damageMult: 1.0, canShoot: false },
  { name: 'skeleton', color: '#d8d8d8', r: 19, speedMult: 1.15, hpMult: 0.95, damageMult: 1.1, canShoot: false },
  { name: 'brute', color: '#9b4d3f', r: 24, speedMult: 0.8, hpMult: 1.35, damageMult: 1.3, canShoot: false },
  { name: 'spitter', color: '#5dd6ff', r: 17, speedMult: 0.85, hpMult: 0.95, damageMult: 0.8, canShoot: true, projectileSpeed: 220, shootCd: 2.1 },
  { name: 'wraith', color: '#9e7bff', r: 16, speedMult: 1.25, hpMult: 0.75, damageMult: 0.9, canShoot: true, projectileSpeed: 280, shootCd: 1.7 },
];

const endlessShopButton = { x: 0, y: 0, w: 90, h: 32 };

const characterConfigs = {
  wizard: { label: 'Wizard', color: '#a774ff', speed: 205, damage: 14, maxHealth: 105, attackInterval: 0.2 },
  bowman: { label: 'Bowman', color: '#63d68e', speed: 245, damage: 11, maxHealth: 110, attackInterval: 0.16 },
  swordsman: { label: 'Swordsman', color: '#7ab7ff', speed: 225, damage: 16, maxHealth: 135, attackInterval: 0.28 },
};

function resetGame(characterKey = selectedCharacter || 'wizard') {
  selectedCharacter = characterKey;
  const cfg = characterConfigs[selectedCharacter];
  player = {
    className: selectedCharacter,
    x: W / 2,
    y: H / 2,
    r: 20,
    speed: cfg.speed,
    damage: cfg.damage,
    maxHealth: cfg.maxHealth,
    health: cfg.maxHealth,
    contactDefense: 0,
    fireRateMult: 1,
    regenPerSecond: 0,
    dashCooldown: 0,
    dashInvuln: 0,
    attackInterval: cfg.attackInterval,
    autoShootCooldown: 0,
  };

  bullets = [];
  enemyProjectiles = [];
  enemies = [];
  keys = {};
  damageNumbers = [];
  shopButtons = [];
  uiButtons = [];
  powerUps = [];
  lastTime = performance.now();
  round = 1;
  coins = 0;
  gameOver = false;
  inShop = false;
  endlessMode = false;
  awaitingEndlessChoice = false;
  survivalTime = 0;
  endlessDifficultyTimer = 0;
  nextRandomBossAt = 12 + Math.random() * 10;
  aimX = W / 2;
  aimY = H / 2;
  killStreak = 0;
  streakTimer = 0;
  streakMultiplier = 1;
  frenzyTimer = 0;
  characterButtons = [];
  selectingCharacter = false;
  spawnWave();
}

window.addEventListener('mousemove', e => {
  aimX = e.clientX;
  aimY = e.clientY;
});

window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  keys[key] = true;

  if (selectingCharacter) {
    if (key === '1') resetGame('wizard');
    if (key === '2') resetGame('bowman');
    if (key === '3') resetGame('swordsman');
    return;
  }

  if (key === 'shift' && canDash()) triggerDash();

  if (inShop) {
    if (key === '1') buyUpgrade('damage');
    if (key === '2') buyUpgrade('speed');
    if (key === '3') buyUpgrade('health');
    if (key === '4') buyUpgrade('defense');
    if (key === '5') buyUpgrade('firerate');
    if (key === '6') buyUpgrade('regen');
    if (key === 'enter') continueToNextRound();
  }

  if (awaitingEndlessChoice) {
    if (key === 'e') startEndlessMode();
    if (key === 'r') resetGame();
  }
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('click', e => {
  const mx = e.clientX;
  const my = e.clientY;

  if (selectingCharacter) {
    for (const card of characterButtons) {
      const inside = mx >= card.x && mx <= card.x + card.w && my >= card.y && my <= card.y + card.h;
      if (inside) {
        resetGame(card.type);
        return;
      }
    }
    return;
  }

  if (gameOver) {
    resetGame();
    return;
  }

  if (awaitingEndlessChoice) {
    for (const btn of uiButtons) {
      const inside = mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h;
      if (inside) {
        if (btn.type === 'endless') startEndlessMode();
        if (btn.type === 'restart') resetGame();
        return;
      }
    }
    return;
  }

  if (endlessMode && !inShop) {
    const insideShop = mx >= endlessShopButton.x && mx <= endlessShopButton.x + endlessShopButton.w
      && my >= endlessShopButton.y && my <= endlessShopButton.y + endlessShopButton.h;
    if (insideShop) {
      openShop();
      return;
    }
  }

  if (inShop) {
    for (const btn of shopButtons) {
      const inside = mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h;
      if (inside) {
        if (btn.type === 'continue') continueToNextRound();
        else buyUpgrade(btn.type);
        return;
      }
    }
  }
});

function canDash() {
  return !gameOver && !inShop && !awaitingEndlessChoice && player.dashCooldown <= 0;
}

function triggerDash() {
  const angle = Math.atan2(aimY - player.y, aimX - player.x);
  const dashDistance = 130;
  player.x += Math.cos(angle) * dashDistance;
  player.y += Math.sin(angle) * dashDistance;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));
  player.dashCooldown = 2.2;
  player.dashInvuln = 0.2;
  addDamageNumber(player.x - 10, player.y - 34, 'DASH!', '#8df7ff');
}

function shootToward(tx, ty) {
  const angle = Math.atan2(ty - player.y, tx - player.x);
  const mult = (frenzyTimer > 0 ? 1.35 : 1);

  if (player.className === 'wizard') {
    bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 650 * player.fireRateMult * mult, vy: Math.sin(angle) * 650 * player.fireRateMult * mult, life: 1.35, size: 5, type: 'orb', angle });
  } else if (player.className === 'bowman') {
    bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 920 * player.fireRateMult * mult, vy: Math.sin(angle) * 920 * player.fireRateMult * mult, life: 1.0, size: 3, type: 'arrow', angle });
  } else {
    bullets.push({ x: player.x + Math.cos(angle) * 22, y: player.y + Math.sin(angle) * 22, vx: Math.cos(angle) * 420 * player.fireRateMult * mult, vy: Math.sin(angle) * 420 * player.fireRateMult * mult, life: 0.32, size: 10, type: 'slash', angle });
  }
}

function createMonster(baseRound, forceType = null) {
  const side = Math.floor(Math.random() * 4);
  let x = Math.random() * W;
  let y = Math.random() * H;
  if (side === 0) x = -40;
  if (side === 1) x = W + 40;
  if (side === 2) y = -40;
  if (side === 3) y = H + 40;

  const type = forceType || monsterTypes[Math.floor(Math.random() * monsterTypes.length)];

  return {
    x,
    y,
    type: type.name,
    color: type.color,
    r: type.r,
    speed: (70 + baseRound * 12) * type.speedMult,
    health: (10 + (baseRound - 1) * 14) * type.hpMult,
    maxHealth: (10 + (baseRound - 1) * 14) * type.hpMult,
    contactDamagePerSecond: (5 + (baseRound - 1) * 1.5) * type.damageMult,
    isBoss: false,
    canShoot: !!type.canShoot,
    projectileSpeed: type.projectileSpeed || 0,
    shootCooldown: (type.shootCd || 1.8) + Math.random() * 1.3,
    shootBase: type.shootCd || 1.8,
    animSeed: Math.random() * Math.PI * 2,
  };
}

function spawnBoss() {
  const boss = createMonster(round + 2, { name: 'boss', color: '#7f39fb', r: 40, speedMult: 0.9, hpMult: 4.2, damageMult: 2.2, canShoot: true, projectileSpeed: 300, shootCd: 1.3 });
  boss.isBoss = true;
  boss.type = 'boss';
  boss.color = '#7f39fb';
  boss.health = (160 + round * 35) * (endlessMode ? 1.8 : 1);
  boss.maxHealth = boss.health;
  boss.speed = 90 + round * 6;
  boss.contactDamagePerSecond = 25 + round * 3;
  boss.canShoot = true;
  boss.projectileSpeed = 320;
  boss.shootBase = 1.2;
  boss.shootCooldown = 0.8;
  enemies.push(boss);
}

function spawnWave() {
  enemies = [];
  bullets = [];
  enemyProjectiles = [];
  damageNumbers = [];
  powerUps = [];

  const count = 5 + round * 2;
  for (let i = 0; i < count; i++) enemies.push(createMonster(round));

  if (round % 5 === 0) spawnBoss();
}

function openShop() {
  if (gameOver || awaitingEndlessChoice) return;
  inShop = true;
  bullets = [];
  enemyProjectiles = [];
}

function continueToNextRound() {
  if (!inShop) return;
  inShop = false;
  if (!endlessMode) {
    round++;
    if (round > 20) {
      awaitingEndlessChoice = true;
      enemies = [];
      bullets = [];
      enemyProjectiles = [];
      return;
    }
  }
  spawnWave();
}

function buyUpgrade(type) {
  const costs = {
    damage: 6,
    speed: 5,
    health: 8,
    defense: 7,
    firerate: 10,
    regen: 12,
  };
  if (coins < costs[type]) return;

  coins -= costs[type];
  if (type === 'damage') player.damage += 3;
  if (type === 'speed') player.speed += 20;
  if (type === 'health') {
    player.maxHealth += 25;
    player.health = Math.min(player.maxHealth, player.health + 30);
  }
  if (type === 'defense') player.contactDefense += 1.5;
  if (type === 'firerate') player.fireRateMult += 0.1;
  if (type === 'regen') player.regenPerSecond += 0.8;
}

function getRandomRarity() {
  const roll = Math.random();
  if (roll < 0.5) return { name: 'Common', color: '#ffffff', mult: 1.08 };
  if (roll < 0.8) return { name: 'Rare', color: '#7ec8ff', mult: 1.15 };
  if (roll < 0.95) return { name: 'Epic', color: '#c68cff', mult: 1.28 };
  return { name: 'Legendary', color: '#ffcc66', mult: 1.45 };
}

function applyRandomRarityUpgrade() {
  const rarity = getRandomRarity();
  const options = [
    { label: 'Damage', apply: () => { player.damage *= rarity.mult; } },
    { label: 'Move Speed', apply: () => { player.speed *= rarity.mult; } },
    { label: 'Max HP', apply: () => { player.maxHealth *= rarity.mult; player.health = Math.min(player.maxHealth, player.health * (1 + (rarity.mult - 1) * 0.7)); } },
    { label: 'Defense', apply: () => { player.contactDefense = (player.contactDefense + 1) * (1 + (rarity.mult - 1) * 0.6); } },
    { label: 'Attack Speed', apply: () => { player.attackInterval = Math.max(0.06, player.attackInterval / rarity.mult); } },
    { label: 'Regen', apply: () => { player.regenPerSecond = Math.max(0.2, player.regenPerSecond + 0.5) * (1 + (rarity.mult - 1) * 0.8); } },
  ];

  const picked = options[Math.floor(Math.random() * options.length)];
  picked.apply();
  addDamageNumber(player.x - 34, player.y - 52, `${rarity.name} ${picked.label}!`, rarity.color);
}

function autoShoot(dt) {
  player.autoShootCooldown -= dt;
  if (player.autoShootCooldown > 0) return;
  if (selectingCharacter || gameOver || inShop || awaitingEndlessChoice) return;

  const tx = Number.isFinite(aimX) ? aimX : player.x + 1;
  const ty = Number.isFinite(aimY) ? aimY : player.y;
  shootToward(tx, ty);
  player.autoShootCooldown = Math.max(0.05, player.attackInterval / (frenzyTimer > 0 ? 1.35 : 1));
}

function grantRandomUpgrade() {
  applyRandomRarityUpgrade();
}

function maybeDropPowerUp(x, y, isBoss) {
  const chance = isBoss ? 0.75 : 0.11;
  if (Math.random() > chance) return;
  const type = Math.random() < 0.5 ? 'heal' : 'frenzy';
  powerUps.push({ x, y, r: 10, type, life: 8 });
}

function collectPowerUps(dt) {
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    p.life -= dt;
    if (p.life <= 0) {
      powerUps.splice(i, 1);
      continue;
    }

    const dx = player.x - p.x;
    const dy = player.y - p.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 120) {
      p.x += dx * dt * 3.4;
      p.y += dy * dt * 3.4;
    }

    if (dist < player.r + p.r) {
      if (p.type === 'heal') {
        player.health = Math.min(player.maxHealth, player.health + 28);
        addDamageNumber(player.x - 20, player.y - 52, '+HEAL', '#7fffd4');
      } else {
        frenzyTimer = Math.max(frenzyTimer, 6);
        addDamageNumber(player.x - 20, player.y - 52, 'FRENZY!', '#ffb3ff');
      }
      powerUps.splice(i, 1);
    }
  }
}

function registerKill(isBoss, x, y, eR) {
  killStreak += 1;
  streakTimer = 3.2;
  streakMultiplier = 1 + Math.floor(killStreak / 5) * 0.2;

  const reward = isBoss ? 10 : Math.max(1, Math.floor(1 * streakMultiplier));
  coins += reward;

  if (isBoss) {
    grantRandomUpgrade();
    addDamageNumber(x - 25, y - eR - 8, `+${reward} coins`, '#89f7a1');
  } else {
    addDamageNumber(x, y - eR - 8, `+${reward} coin${reward > 1 ? 's' : ''}`, '#89f7a1');
  }

  maybeDropPowerUp(x, y, isBoss);
}

function addDamageNumber(x, y, text, color = '#ffd54f') {
  damageNumbers.push({ x, y, text, color, life: 0.9, vy: -28 });
}

function updateDamageNumbers(dt) {
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const n = damageNumbers[i];
    n.y += n.vy * dt;
    n.life -= dt;
    if (n.life <= 0) damageNumbers.splice(i, 1);
  }
}

function maybeSpawnEndlessBoss() {
  if (!endlessMode) return;
  if (survivalTime < nextRandomBossAt) return;

  spawnBoss();
  addDamageNumber(W / 2 - 60, 80, 'Random Boss Spawned!', '#ff9ced');
  nextRandomBossAt = survivalTime + 12 + Math.random() * 14;
}

function scaleEndlessDifficulty() {
  for (const e of enemies) {
    e.speed *= 2;
    e.health *= 2;
    e.maxHealth *= 2;
    e.contactDamagePerSecond *= 2;
  }
  addDamageNumber(W / 2 - 70, 110, 'Endless difficulty x2!', '#ff8a80');
}

function startEndlessMode() {
  awaitingEndlessChoice = false;
  endlessMode = true;
  inShop = false;
  bullets = [];
  enemyProjectiles = [];
  enemies = [];
  round = 21;
  endlessDifficultyTimer = 0;
  nextRandomBossAt = survivalTime + 10 + Math.random() * 8;
  spawnWave();
}

function enemyShoot(e) {
  const ang = Math.atan2(player.y - e.y, player.x - e.x);
  enemyProjectiles.push({
    x: e.x,
    y: e.y,
    vx: Math.cos(ang) * e.projectileSpeed,
    vy: Math.sin(ang) * e.projectileSpeed,
    r: e.isBoss ? 7 : 5,
    life: 4,
    damage: e.isBoss ? 14 + round * 1.2 : 6 + round * 0.35,
    color: e.isBoss ? '#ffd180' : '#9ee7ff',
  });
}

function update(dt) {
  if (selectingCharacter) return;
  updateDamageNumbers(dt);
  if (gameOver || inShop || awaitingEndlessChoice) return;

  survivalTime += dt;
  if (player.dashCooldown > 0) player.dashCooldown -= dt;
  if (player.dashInvuln > 0) player.dashInvuln -= dt;

  if (streakTimer > 0) {
    streakTimer -= dt;
    if (streakTimer <= 0) {
      killStreak = 0;
      streakMultiplier = 1;
    }
  }

  if (frenzyTimer > 0) frenzyTimer -= dt;

  if (player.regenPerSecond > 0) {
    player.health = Math.min(player.maxHealth, player.health + player.regenPerSecond * dt);
  }

  autoShoot(dt);

  if (endlessMode) {
    endlessDifficultyTimer += dt;
    if (endlessDifficultyTimer >= 10) {
      endlessDifficultyTimer = 0;
      scaleEndlessDifficulty();
    }
    maybeSpawnEndlessBoss();
  }

  let mx = 0;
  let my = 0;
  if (keys.w) my -= 1;
  if (keys.s) my += 1;
  if (keys.a) mx -= 1;
  if (keys.d) mx += 1;

  const len = Math.hypot(mx, my);
  if (len > 0) {
    mx /= len;
    my /= len;
  }

  const speedBoost = frenzyTimer > 0 ? 1.22 : 1;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x + mx * player.speed * speedBoost * dt));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y + my * player.speed * speedBoost * dt));

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    const outOfBounds = b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10;
    if (b.life <= 0 || outOfBounds) bullets.splice(i, 1);
  }

  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
      enemyProjectiles.splice(i, 1);
      continue;
    }

    if (Math.hypot(player.x - p.x, player.y - p.y) < player.r + p.r) {
      if (player.dashInvuln <= 0) {
        const hit = Math.max(1, p.damage - player.contactDefense * 0.5);
        player.health -= hit;
        addDamageNumber(player.x + (Math.random() - 0.5) * 20, player.y - 28, `-${hit.toFixed(0)}`, '#ff7f7f');
        if (player.health <= 0) {
          player.health = 0;
          gameOver = true;
        }
      }
      enemyProjectiles.splice(i, 1);
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(ang) * e.speed * dt;
    e.y += Math.sin(ang) * e.speed * dt;

    if (e.canShoot) {
      e.shootCooldown -= dt;
      if (e.shootCooldown <= 0) {
        enemyShoot(e);
        e.shootCooldown = Math.max(0.5, e.shootBase - round * 0.015) + Math.random() * 0.5;
      }
    }

    if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r) {
      if (player.dashInvuln <= 0) {
        const effectiveDamage = Math.max(1, e.contactDamagePerSecond - player.contactDefense);
        player.health -= effectiveDamage * dt;
        addDamageNumber(player.x + (Math.random() - 0.5) * 20, player.y - 28, `-${effectiveDamage.toFixed(0)}`, '#ff6b6b');
        if (player.health <= 0) {
          player.health = 0;
          gameOver = true;
        }
      }
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + (b.size || 4)) {
        const crit = Math.random() < 0.15;
        const dmg = crit ? Math.floor(player.damage * 1.8) : player.damage;
        e.health -= dmg;
        addDamageNumber(e.x + (Math.random() - 0.5) * 16, e.y - e.r, crit ? `CRIT ${dmg}` : `-${dmg}`, crit ? '#ff9d00' : '#ffec80');
        bullets.splice(j, 1);
        if (e.health <= 0) {
          enemies.splice(i, 1);
          registerKill(e.isBoss, e.x, e.y, e.r);
          break;
        }
      }
    }
  }

  collectPowerUps(dt);

  if (!gameOver && enemies.length === 0) {
    if (endlessMode) spawnWave();
    else openShop();
  }
}

function drawHealthBar(x, y, w, h, value, max) {
  ctx.fillStyle = 'black';
  ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = 'red';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'lime';
  ctx.fillRect(x, y, (value / max) * w, h);
}

function drawPlayerCharacter() {
  const swing = Math.sin(survivalTime * 10) * 3;

  if (player.dashInvuln > 0) {
    ctx.fillStyle = 'rgba(141, 247, 255, 0.35)';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 10, 0, Math.PI * 2);
    ctx.fill();
  }

  if (player.className === 'wizard') {
    ctx.fillStyle = '#f5c7a9';
    ctx.beginPath();
    ctx.arc(player.x, player.y - 22, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6a38c7';
    ctx.fillRect(player.x - 10, player.y - 12, 20, 28);
    ctx.beginPath();
    ctx.moveTo(player.x - 12, player.y - 22);
    ctx.lineTo(player.x, player.y - 42);
    ctx.lineTo(player.x + 12, player.y - 22);
    ctx.fill();
    ctx.fillStyle = '#a774ff';
    ctx.beginPath();
    ctx.arc(player.x + 15, player.y - 6 + swing * 0.4, 4, 0, Math.PI * 2);
    ctx.fill();
  } else if (player.className === 'bowman') {
    ctx.fillStyle = '#f5c7a9';
    ctx.beginPath();
    ctx.arc(player.x, player.y - 20, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2e8b57';
    ctx.fillRect(player.x - 9, player.y - 10, 18, 26);
    ctx.strokeStyle = '#9d6a3a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x + 12, player.y - 2, 10, -1.1, 1.1);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(player.x + 7, player.y - 10);
    ctx.lineTo(player.x + 15, player.y + 8);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#f5c7a9';
    ctx.beginPath();
    ctx.arc(player.x, player.y - 20, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a7ba8';
    ctx.fillRect(player.x - 10, player.y - 10, 20, 26);
    ctx.strokeStyle = '#d0e6ff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(player.x + 8, player.y - 4);
    ctx.lineTo(player.x + 20, player.y + 8 + swing * 0.5);
    ctx.stroke();
  }
}

function drawMonster(e) {
  const bob = Math.sin(survivalTime * 4 + e.animSeed) * 2;

  if (e.type === 'slime') {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + 3 + bob, e.r, e.r * 0.75 + Math.sin(survivalTime * 6 + e.animSeed) * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.type === 'goblin') {
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x - e.r * 0.6, e.y - e.r * 0.6 + bob, e.r * 1.2, e.r * 1.2);
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(e.x - e.r * 0.15, e.y - e.r * 0.15 + bob, e.r * 0.3, e.r * 0.3);
  } else if (e.type === 'skeleton') {
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(e.x, e.y - 6 + bob, e.r * 0.35, 0, Math.PI * 2);
    ctx.moveTo(e.x, e.y - e.r * 0.6 + bob);
    ctx.lineTo(e.x, e.y + e.r * 0.6 + bob);
    ctx.moveTo(e.x - e.r * 0.45, e.y - e.r * 0.2 + bob);
    ctx.lineTo(e.x + e.r * 0.45, e.y - e.r * 0.2 + bob);
    ctx.moveTo(e.x, e.y + e.r * 0.6 + bob);
    ctx.lineTo(e.x - e.r * 0.4, e.y + e.r + bob);
    ctx.moveTo(e.x, e.y + e.r * 0.6 + bob);
    ctx.lineTo(e.x + e.r * 0.4, e.y + e.r + bob);
    ctx.stroke();
  } else if (e.type === 'spitter') {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y + bob, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#00354a';
    ctx.beginPath();
    ctx.arc(e.x + Math.cos(survivalTime * 3 + e.animSeed) * 4, e.y + bob, 5, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.type === 'wraith') {
    ctx.fillStyle = 'rgba(158, 123, 255, 0.75)';
    ctx.beginPath();
    ctx.moveTo(e.x, e.y - e.r + bob);
    ctx.quadraticCurveTo(e.x + e.r, e.y, e.x, e.y + e.r + bob);
    ctx.quadraticCurveTo(e.x - e.r, e.y, e.x, e.y - e.r + bob);
    ctx.fill();
  } else if (e.type === 'boss') {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y + bob * 0.5, e.r + Math.sin(survivalTime * 2) * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffe082';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(e.x, e.y + bob * 0.5, e.r + 6 + Math.sin(survivalTime * 3 + e.animSeed), 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('BOSS', e.x - 20, e.y + 5 + bob);
  } else {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y + bob, e.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPowerUp(p) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = p.type === 'heal' ? '#6fffa2' : '#ff8bff';
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#0b1b2a';
  ctx.font = 'bold 12px Arial';
  ctx.fillText(p.type === 'heal' ? '+' : 'F', p.x - 3, p.y + 4);
}

function drawGameOverOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 56px Arial';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
  ctx.font = 'bold 30px Arial';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText('RESTART', W / 2, H / 2 + 35);
  ctx.font = '20px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('Click anywhere to restart', W / 2, H / 2 + 70);
  ctx.textAlign = 'left';
}

function drawEndlessChoiceOverlay() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.68)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px Arial';
  ctx.fillText('You cleared Round 20!', W / 2, H / 2 - 120);
  ctx.font = '24px Arial';
  ctx.fillText('Choose what to do next:', W / 2, H / 2 - 80);

  uiButtons = [];
  const btnW = 300;
  const btnH = 58;
  const bx = W / 2 - btnW / 2;

  ctx.fillStyle = '#5d3fd3';
  ctx.fillRect(bx, H / 2 - 30, btnW, btnH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px Arial';
  ctx.fillText('Start Endless [E]', W / 2, H / 2 + 8);
  uiButtons.push({ x: bx, y: H / 2 - 30, w: btnW, h: btnH, type: 'endless' });

  ctx.fillStyle = '#2e7d32';
  ctx.fillRect(bx, H / 2 + 44, btnW, btnH);
  ctx.fillStyle = '#fff';
  ctx.fillText('Restart Run [R]', W / 2, H / 2 + 82);
  uiButtons.push({ x: bx, y: H / 2 + 44, w: btnW, h: btnH, type: 'restart' });

  ctx.textAlign = 'left';
}


function drawCharacterSelect() {
  ctx.fillStyle = '#08111b';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px Arial';
  ctx.fillText('Choose Your Hero', W / 2, 90);
  ctx.font = '22px Arial';
  ctx.fillStyle = '#b9d8ff';
  ctx.fillText('1 Wizard   2 Bowman   3 Swordsman', W / 2, 126);

  const cards = [
    { type: 'wizard', label: 'Wizard', desc: 'High damage magic orbs' },
    { type: 'bowman', label: 'Bowman', desc: 'Fastest attack speed' },
    { type: 'swordsman', label: 'Swordsman', desc: 'Tanky melee slashes' },
  ];

  characterButtons = [];
  const w = 250, h = 290, gap = 28;
  const startX = W / 2 - (w * 3 + gap * 2) / 2;

  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const x = startX + i * (w + gap);
    const y = 170;
    const cfg = characterConfigs[c.type];

    ctx.fillStyle = '#12283d';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = cfg.color;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = cfg.color;
    ctx.font = 'bold 28px Arial';
    ctx.fillText(c.label, x + w / 2, y + 42);
    ctx.fillStyle = '#fff';
    ctx.font = '18px Arial';
    ctx.fillText(c.desc, x + w / 2, y + 72);
    ctx.fillText(`Damage: ${cfg.damage}`, x + w / 2, y + 120);
    ctx.fillText(`Speed: ${cfg.speed}`, x + w / 2, y + 150);
    ctx.fillText(`HP: ${cfg.maxHealth}`, x + w / 2, y + 180);
    ctx.fillText(`Atk/s: ${(1 / cfg.attackInterval).toFixed(1)}`, x + w / 2, y + 210);
    ctx.fillStyle = '#ffd54f';
    ctx.fillText('Click to Select', x + w / 2, y + 250);

    characterButtons.push({ x, y, w, h, type: c.type });
  }
  ctx.textAlign = 'left';
}

function drawShopOverlay() {
  ctx.fillStyle = 'rgba(8,16,28,0.78)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 46px Arial';
  ctx.fillText('SHOP', W / 2, 90);
  ctx.font = '20px Arial';
  ctx.fillStyle = '#b9d8ff';
  ctx.fillText(endlessMode ? 'Game paused while in shop' : `Round ${round} cleared! Spend coins before Round ${round + 1}`, W / 2, 125);

  const boxW = 560;
  const boxH = 50;
  const startX = W / 2 - boxW / 2;
  const startY = 160;
  const gap = 12;

  const items = [
    { type: 'damage', label: '[1] +3 Damage', cost: 6 },
    { type: 'speed', label: '[2] +20 Move Speed', cost: 5 },
    { type: 'health', label: '[3] +25 Max HP (+heal)', cost: 8 },
    { type: 'defense', label: '[4] +1.5 Contact Defense', cost: 7 },
    { type: 'firerate', label: '[5] +10% Bullet Speed', cost: 10 },
    { type: 'regen', label: '[6] +0.8 HP/s Regen', cost: 12 },
  ];

  shopButtons = [];
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const x = startX;
    const y = startY + i * (boxH + gap);
    const affordable = coins >= item.cost;

    ctx.fillStyle = affordable ? '#173b5f' : '#353535';
    ctx.fillRect(x, y, boxW, boxH);
    ctx.strokeStyle = affordable ? '#80d3ff' : '#727272';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, boxW, boxH);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(item.label, x + 16, y + 32);
    ctx.textAlign = 'right';
    ctx.fillStyle = affordable ? '#ffd54f' : '#aaaaaa';
    ctx.fillText(`${item.cost} coins`, x + boxW - 16, y + 32);

    shopButtons.push({ x, y, w: boxW, h: boxH, type: item.type });
  }

  const continueW = 300;
  const continueH = 52;
  const continueX = W / 2 - continueW / 2;
  const continueY = startY + items.length * (boxH + gap) + 12;
  ctx.fillStyle = '#2e7d32';
  ctx.fillRect(continueX, continueY, continueW, continueH);
  ctx.strokeStyle = '#9cff9f';
  ctx.strokeRect(continueX, continueY, continueW, continueH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(endlessMode ? 'Close Shop [Enter]' : 'Continue [Enter]', W / 2, continueY + 34);
  shopButtons.push({ x: continueX, y: continueY, w: continueW, h: continueH, type: 'continue' });

  ctx.font = '18px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('Click an upgrade or use 1-6. Press Enter to continue.', W / 2, continueY + 82);
  ctx.textAlign = 'left';
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  if (selectingCharacter) {
    drawCharacterSelect();
    return;
  }

  drawPlayerCharacter();
  drawHealthBar(player.x - 30, player.y - 50, 60, 8, player.health, player.maxHealth);

  for (const e of enemies) drawHealthBar(e.x - 20, e.y - 35, 40, 6, e.health, e.maxHealth);
  for (const e of enemies) drawMonster(e);
  for (const p of powerUps) drawPowerUp(p);

  for (const b of bullets) {
    if (b.type === 'arrow') {
      ctx.strokeStyle = '#ffd180';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x - Math.cos(b.angle) * 8, b.y - Math.sin(b.angle) * 8);
      ctx.lineTo(b.x + Math.cos(b.angle) * 8, b.y + Math.sin(b.angle) * 8);
      ctx.stroke();
    } else if (b.type === 'slash') {
      ctx.strokeStyle = '#d6ecff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 12, b.angle - 0.9, b.angle + 0.9);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#d38bff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size || 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (const p of enemyProjectiles) {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.font = '18px Arial';
  ctx.fillStyle = 'white';
  ctx.fillText(`Round: ${round}`, 20, 30);
  ctx.fillText(`${characterConfigs[player.className].label}  Damage: ${player.damage.toFixed(1)}`, 20, 55);
  ctx.fillText(`Time: ${survivalTime.toFixed(1)}s`, 20, 80);
  ctx.fillText(`Atk Spd: ${(1 / player.attackInterval).toFixed(1)}/s`, 20, 105);
  ctx.fillText(`Combo x${streakMultiplier.toFixed(1)}`, 20, 130);
  ctx.fillText(`Dash: ${player.dashCooldown <= 0 ? 'READY [Shift]' : player.dashCooldown.toFixed(1) + 's'}`, 20, 155);

  if (frenzyTimer > 0) {
    ctx.fillStyle = '#ff9dff';
    ctx.fillText(`Frenzy ${frenzyTimer.toFixed(1)}s`, 20, 180);
  }

  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd54f';
  ctx.font = 'bold 22px Arial';
  ctx.fillText(`Coins: ${coins}`, W - 20, 34);

  if (endlessMode) {
    endlessShopButton.x = W - 130;
    endlessShopButton.y = 44;
    ctx.fillStyle = '#2c5f8a';
    ctx.fillRect(endlessShopButton.x, endlessShopButton.y, endlessShopButton.w, endlessShopButton.h);
    ctx.strokeStyle = '#8dd7ff';
    ctx.strokeRect(endlessShopButton.x, endlessShopButton.y, endlessShopButton.w, endlessShopButton.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText('Shop', W - 65, 67);
  }
  ctx.textAlign = 'left';

  for (const n of damageNumbers) {
    const alpha = Math.max(0, Math.min(1, n.life / 0.9));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = n.color;
    ctx.font = 'bold 18px Arial';
    ctx.fillText(n.text, n.x, n.y);
  }
  ctx.globalAlpha = 1;

  if (inShop) drawShopOverlay();
  if (awaitingEndlessChoice) drawEndlessChoiceOverlay();
  if (gameOver) drawGameOverOverlay();
}

function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

selectingCharacter = true;
selectedCharacter = null;
characterButtons = [];
loop();
</script>
</body>
</html>
